name: Bug report
description: Report a problem in the gallery documentation, links or media.
labels: [bug]
body:
  - type: textarea
    id: details
    attributes:
      label: What is wrong?
      description: Describe the issue in the gallery, documentation or media files.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This report concerns only the public gallery and its documentation.
          required: true
