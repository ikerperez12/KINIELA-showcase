name: Showcase bug
description: Report a problem in the product gallery or isolated demo.
title: "[showcase bug] "
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, production accounts, private endpoints, or vulnerability details. Use the private security reporting channel linked below for security issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue in the gallery or local demo.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page and actions needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This report concerns only the public gallery or isolated local demo.
          required: true
