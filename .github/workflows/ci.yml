name: Showcase checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan source and configuration
        run: npm run check:forbidden
      - run: npm run check:links
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Scan production build output
        run: npm run check:forbidden
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.5'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan bundled JavaScript, styles, and maps for secrets
        run: gitleaks dir dist/assets --redact --verbose
      - name: Scan built HTML for secrets
        run: gitleaks dir dist/index.html --redact --verbose
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
