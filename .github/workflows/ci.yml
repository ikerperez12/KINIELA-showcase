name: Showcase checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scan source and configuration
        run: npm run check:forbidden
      - run: npm run check:links
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Scan production build output
        run: npm run check:forbidden
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan bundled JavaScript, styles, and maps for secrets
        run: gitleaks dir dist/assets --redact --verbose
      - name: Scan built HTML for secrets
        run: gitleaks dir dist/index.html --redact --verbose
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
